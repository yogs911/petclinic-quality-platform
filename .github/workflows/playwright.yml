name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080

    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4

      - name: Checkout Petclinic
        uses: actions/checkout@v4
        with:
          repository: yogs911/spring-petclinic
          path: spring-petclinic
          token: ${{ secrets.PETCLINIC_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start Petclinic
        working-directory: spring-petclinic
        run: docker compose up -d

      - name: Check containers
        working-directory: spring-petclinic
        run: docker compose ps

      - name: Wait for Petclinic
        run: |
          for i in {1..30}; do
            if curl --fail "$BASE_URL" >/dev/null 2>&1; then
              echo "Petclinic is ready"
              exit 0
            fi

            echo "Waiting for Petclinic..."
            sleep 5
          done

          echo "Petclinic did not become ready"
          exit 1

      - name: Run Playwright tests
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npm run test:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: report/allure-report/

      - name: Show Petclinic logs
        if: failure()
        working-directory: spring-petclinic
        run: docker compose logs

      - name: Stop Petclinic
        if: always()
        working-directory: spring-petclinic
        run: docker compose down -v