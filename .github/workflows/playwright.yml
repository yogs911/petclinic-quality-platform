name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4

      - name: Checkout Petclinic
        uses: actions/checkout@v4
        with:
          repository: yogs911/spring-petclinic
          path: spring-petclinic
          token: ${{ secrets.PETCLINIC_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start Petclinic
        working-directory: spring-petclinic
        run: docker compose up -d

      - name: Check containers
        working-directory: spring-petclinic
        run: docker compose ps
      
      - name: Wait for Petclinic
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/ >/dev/null 2>&1; then
              echo "Petclinic is ready"
              exit 0
            fi

            echo "Waiting for Petclinic..."
            sleep 5
          done

          echo "Petclinic did not become ready"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
      
      - name: Generate Playwright report
        run: npm run test:report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Show Petclinic logs
        if: failure()
        working-directory: spring-petclinic
        run: docker compose logs

      - name: Stop Petclinic
        if: always()
        working-directory: spring-petclinic
        run: docker compose down -v